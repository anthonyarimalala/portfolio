<section id="projects" class="mx-auto w-full max-w-6xl px-6 pb-24 scroll-mt-24">
  <div data-animate class="space-y-8">
    <div>
      <p class="section-kicker">Projets</p>
      <h2 class="font-display text-3xl md:text-4xl">Quelques projets personnels et académiques</h2>
    </div>
    <div class="carousel" aria-label="Carrousel de projets" #carousel>
      <div class="carousel-track" #track>
        <article
          class="project-card carousel-item"
          *ngFor="let project of displayedProjects; let i = index"
          [attr.aria-hidden]="project.isClone ? 'true' : null"
        >
          <div
            class="project-media"
            [ngClass]="project.mediaClass"
            [style.--project-image]="project.coverImage ? 'url(' + project.coverImage + ')' : null"
          >
            <div class="project-badge">{{ project.badge }}</div>
          </div>
          <div class="space-y-3">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
            <div class="flex flex-wrap gap-2 text-xs text-white/70">
              <span class="tag" *ngFor="let tag of project.tags">{{ tag }}</span>
            </div>
          </div>
          <div class="project-actions">
            <button
              type="button"
              class="details-button"
              (click)="toggleDetails(i)"
              [attr.aria-expanded]="openIndex === i"
              [attr.aria-controls]="'project-details-' + i"
            >
              {{ openIndex === i ? 'Fermer' : 'Voir les détails' }}
            </button>
          </div>
          <div
            class="project-details-wrapper"
            *ngIf="openIndex === i"
            [attr.id]="'project-details-' + i"
          >
            <app-project-details
              [images]="project.images"
              [details]="project.details"
            ></app-project-details>
          </div>
        </article>
      </div>
    </div>

    <!-- Indicateur visuel pour Shift+scroll -->
    <div class="scroll-hint" *ngIf="!isDragging">
      <span class="shift-hint">Shift ⇧ + molette pour naviguer</span>
    </div>
  </div>
</section>
