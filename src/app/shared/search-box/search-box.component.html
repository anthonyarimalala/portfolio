<div class="box">
  <app-icon class="icon" name="search" />

  <input
    type="text"
    readonly
    tabindex="-1"
    autocomplete="off"
    aria-label="Recherche (non modifiable)"
    [value]="text()"
    (keydown)="onKeydown($event)"
    (paste)="block($event)"
    (cut)="block($event)"
    (drop)="block($event)"
    (beforeinput)="block($event)"
  />
</div>
