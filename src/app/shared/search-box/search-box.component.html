<div class="box" [class.compact]="compact()">
  @if (!compact()) {
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
      />
    </svg>
  }

  <input
    type="text"
    readonly
    tabindex="-1"
    autocomplete="off"
    aria-label="Recherche (non modifiable)"
    [value]="text()"
    (keydown)="onKeydown($event)"
    (paste)="block($event)"
    (cut)="block($event)"
    (drop)="block($event)"
    (beforeinput)="block($event)"
  />

  @if (compact()) {
    <button type="button" class="submit" aria-label="Rechercher" (click)="submitted.emit()">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
        />
      </svg>
    </button>
  }
</div>
